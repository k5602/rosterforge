edition = "2024"
description = "not really needed but i'm a maniac when it comes to validation"
[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.rf]
path = ".."

[[bin]]
name = "refpack_decompress"
